  <!-- Decorative circle -->
  <circle cx="1000" cy="315" r="180" stroke="#c9a86c" stroke-width="0.5" opacity="0.12"/>
  <circle cx="1000" cy="315" r="130" stroke="#c9a86c" stroke-width="0.5" opacity="0.08"/>
  <circle cx="1000" cy="315" r="80" fill="#c9a86c" opacity="0.04"/>
</svg>
