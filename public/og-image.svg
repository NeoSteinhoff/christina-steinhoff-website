<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#060606"/>

  <!-- Subtle gradient overlay -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#c9a86c" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#060606" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top line -->
  <rect x="100" y="180" width="40" height="1" fill="#c9a86c" opacity="0.4"/>

  <!-- Eyebrow -->
  <text x="155" y="185" fill="#c9a86c" opacity="0.6" font-family="Georgia, serif" font-size="13" letter-spacing="5" font-weight="300">LIFE MENTOR · DUBAI</text>

  <!-- Main name -->
  <text x="98" y="290" fill="white" font-family="Georgia, serif" font-size="72" font-weight="300" letter-spacing="-1">Christina</text>
  <text x="98" y="370" fill="white" font-family="Georgia, serif" font-size="72" font-weight="300" letter-spacing="-1">Steinhoff</text>

  <!-- Gold accent line -->
  <rect x="98" y="400" width="120" height="1.5" fill="#c9a86c" opacity="0.6"/>

  <!-- Tagline -->
